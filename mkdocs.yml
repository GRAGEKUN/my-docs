site_name: 我的技术文档
site_url: https://GRAGEKUN.github.io/my-docs/
repo_url: https://github.com/GRAGEKUN/my-docs
repo_name: GRAGEKUN/my-docs
site_description: 使用 MkDocs Material 搭建、由 GitHub Actions 自动部署到 GitHub Pages 的个人文档站。
theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
nav:
  - 首页: index.md
  - 关于: about.md
  - 使用指南: guide.md
  - API参考: api.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
